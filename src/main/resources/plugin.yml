name: SuffixCommands
main: com.minetexas.suffixcommands.SuffixCommands
version: 0.16
author: ataranlen
description: Simple Badge Groups for User selectable pexPermission Suffixes

commands:
  badge:
    description: Change your badge to one that you own.
    permission: suffixcommands.badge.set
    permission-message: You are not allowed to change your own badge
  chat:
    description: Send a message to your badge group.
    permission: suffixcommands.badge.chat
    permission-message: You are not allowed to use this chat.
  bc:
    description: Send a message to your badge group.
    permission: suffixcommands.badge.chat
    permission-message: You are not allowed to use this chat.
  chattoggle:
    description: Toggle badge chat spy
    permission: suffixcommands.chat.spy
    permission-message: You are not allowed to use this command.
  gang:
    description: Change your gang to one that you own.
    permission: suffixcommands.gang.set
    permission-message: You are not allowed to change your own gang
  rename:
    description: Rename a badge after confirmation.
    permission: suffixcommands.badge.rename
    permission-message: You are not allowed to rename badges.